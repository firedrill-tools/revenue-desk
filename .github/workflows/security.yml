name: Secret history
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner and scan history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SCANNER_DIR="$(mktemp -d)"
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir "$SCANNER_DIR" --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt
          cd "$SCANNER_DIR"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$SCANNER_DIR/gitleaks" git --log-opts="--all --full-history" --redact=100 .
